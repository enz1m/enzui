name: Rust checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
jobs:
  linux:
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_WARNINGS: deny
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwayland-dev libxkbcommon-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libcurl4-openssl-dev libssl-dev zlib1g-dev fonts-dejavu-core
      - name: Install Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo wcheck --locked
      - run: cargo wclippy
      - name: API documentation
        run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --workspace --all-features --no-deps
      - name: Complete application example
        run: cargo wbuild --locked --example app
      - name: Documentation and application contracts
        run: |
          cargo wt --locked --test feature_reference every_crate_feature_is_documented
          cargo wt --locked --test contracts widget_catalog_page
          cargo wt --locked --test dialogs_modals_sheets modal_focus_lifecycle
  msrv:
    name: Minimum Rust 1.95
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwayland-dev libxkbcommon-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libcurl4-openssl-dev libssl-dev zlib1g-dev fonts-dejavu-core
      - name: Install minimum Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - run: cargo +1.95.0 wcheck --locked
      - run: cargo +1.95.0 wbuild --locked --example app
