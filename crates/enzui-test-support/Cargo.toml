[package]
name = "enzui-test-support"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
publish = false
description = "Source-tree and adoption gates used only by enzUI test builds."

[features]
rust-syntax = ["dep:syn"]

[dependencies]
# Minimal: only `widget::Operation` and `widget::operation::Outcome` are used,
# so the chain-following helper stays renderer- and runtime-free.
iced_core.workspace = true
syn = { version = "2", features = ["full", "visit"], optional = true }

[lints]
workspace = true


[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bin]]
name = "enzui-style-inventory"
path = "src/bin/style_inventory.rs"
required-features = ["rust-syntax"]
