[package]
name = "enzui-agent-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
publish = false
description = "Shared agent-process glue for enzUI apps: single instance, background mode and presentation."

[dependencies]
log.workspace = true
enzui-agent = { workspace = true, features = ["background"] }
enzui-core = { workspace = true, features = ["application-dbus"] }
iced_futures.workspace = true
iced_runtime.workspace = true
serde_json = "1"

[dev-dependencies]
enzui-test-support.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
