[package]
name = "enzui-terminal"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
publish = false
description = "A GPU terminal view for enzUI apps: glyph atlases, instanced cells and row damage."

[features]
# Window backends, forwarded to iced. The renderer's software fallback needs
# one to compile, so both are on by default, as in iced.
default = ["wayland"]
x11 = ["iced/x11"]
wayland = ["iced/wayland"]

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
enzui-core.workspace = true
enzui-theme.workspace = true
etagere = "0.2"
futures = "0.3"
iced = { workspace = true, features = ["advanced"] }
iced_graphics.workspace = true
iced_wgpu.workspace = true

[dev-dependencies]
iced_test.workspace = true
# The accessibility tests publish the terminal through the vendored AT-SPI
# adapter the product uses (by path, as enzui-widgets does).
accesskit = { git = "https://github.com/enz1m/enzim-accesskit.git", rev = "e9da4a8da1825e65356f35c94325fb9438cf90d0", version = "0.24" }
accesskit_atspi_common = { git = "https://github.com/enz1m/enzim-accesskit.git", rev = "e9da4a8da1825e65356f35c94325fb9438cf90d0", version = "0.19.1" }
atspi-common = "0.13"
enzui-core = { workspace = true, features = ["accesskit"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
