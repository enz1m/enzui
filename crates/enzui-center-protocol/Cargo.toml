[package]
name = "enzui-center-protocol"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
publish = false
description = "The enzui-center app wire: framing, message types, credential format and handshake proofs, shared by the daemon and app connectors."

[dependencies]
enzui-security.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
